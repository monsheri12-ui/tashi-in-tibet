          expected={'build': 'main', 'version': '1.0.7.10', 'previousVersion': '1.0.7.9', 'before': {'assets/js/game-00.js': '074921182720f1b8adf33dd60c6c559c85442edd0e7c78138483b1ca6b5e1eea', 'assets/js/game-08.js': 'ebafda593fc09c332677c1a330abd5ee9076e1eb1551a3506e2919ba74e2c26c', 'assets/js/game-09.js': '28e12071e97afa24f2d8192127ef3ce2932e64e3dbdf9fce579c082dfa692874', 'index.html': 'c330c5ee2403a743b5aecb3a16e0a03293ed9a18aa88522b903486dc151546b6', 'assets/manifest.json': '8d9be62fa1cff8640e8db73b2f3df18e4e033b07054448ed47dfd1bb24b00494'}, 'after': {'assets/js/game-00.js': '5feb19dc73b2d730638e4694ea1aa0128591060dc63f5f8090255363d87ae7f3', 'assets/js/game-08.js': '9e62d539d6f78a4b02e4e74f0879690efdc712bbb4953bcaab00ebc3fb2c5662', 'assets/js/game-09.js': 'c748b352dc03611ff1044a8af4c2c1a0e8da3960efc49e4b1d64f8c157b5de95', 'index.html': 'e77f3242a896b5209ce0be305ee386122b57a3c62ffafb83cf759c036540c8b5', 'assets/manifest.json': '3347739a66d82cc457244151e40732818be5b839916acc7ae825f0a86caad90a'}, 'verifiedResources': 493}
